<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="40%" stop-color="#c99320"/>
      <stop offset="70%" stop-color="#8a5a06"/>
      <stop offset="100%" stop-color="#f2cf6b"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)" opacity="0.95">
    <!-- Outer Sacred Circle with Dash Array -->
    <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="205" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- 16 Directional Energy Rays (16 Vastu Zones) -->
    <g stroke="url(#goldGrad)" stroke-width="1.8">
      <!-- 0 deg -->
      <line x1="250" y1="45" x2="250" y2="15"/>
      <line x1="250" y1="455" x2="250" y2="485"/>
      <!-- 90 deg -->
      <line x1="45" y1="250" x2="15" y2="250"/>
      <line x1="455" y1="250" x2="485" y2="250"/>
      <!-- 45 deg -->
      <line x1="105" y1="105" x2="84" y2="84"/>
      <line x1="395" y1="395" x2="416" y2="416"/>
      <line x1="395" y1="105" x2="416" y2="84"/>
      <line x1="105" y1="395" x2="84" y2="416"/>

      <!-- 22.5 deg intermediates -->
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(22.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(67.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(112.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(157.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(202.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(247.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(292.5 250 250)"/>
      <line x1="250" y1="50" x2="250" y2="25" transform="rotate(337.5 250 250)"/>
    </g>

    <!-- 16 Sacred Lotus Petals Ring -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="1.8">
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(22.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(45 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(67.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(90 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(112.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(135 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(157.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(180 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(202.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(225 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(247.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(270 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(292.5 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(315 250 250)"/>
      <path d="M 250 60 Q 265 110 250 140 Q 235 110 250 60 Z" transform="rotate(337.5 250 250)"/>
    </g>

    <!-- Inner Geometric Star Matrix -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="250" cy="250" r="125" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Central Sacred Octagram Star -->
    <polygon points="250,130 280,220 370,250 280,280 250,370 220,280 130,250 220,220" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <polygon points="250,130 280,220 370,250 280,280 250,370 220,280 130,250 220,220" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" transform="rotate(45 250 250)"/>

    <!-- Central Bindu Core -->
    <circle cx="250" cy="250" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="250" cy="250" r="28" fill="url(#goldGrad)" opacity="0.4"/>
    <circle cx="250" cy="250" r="12" fill="url(#goldGrad)"/>
  </g>
</svg>
